<h1>Catálogo</h1>

<table>
  <thead>
    <tr><th>Nombre</th><th>Descripción</th><th>Precio</th><th>Stock</th></tr>
  </thead>
  <tbody>
    @for (p of products(); track p.id) {
      <tr>
        <td>{{ p.name }}</td>
        <td>{{ p.description }}</td>
        <td>{{ p.price | currency: 'COP' : 'symbol-narrow' : '1.0-0' }}</td>
        <td>{{ p.stock }}</td>
      </tr>
    } @empty {
      <tr><td colspan="4">No hay productos</td></tr>
    }
  </tbody>
</table>

<div class="pager">
  <button (click)="load(page() - 1)" [disabled]="page() === 0">Anterior</button>
  <span>Página {{ page() + 1 }} de {{ totalPages() }}</span>
  <button (click)="load(page() + 1)" [disabled]="page() + 1 >= totalPages()">Siguiente</button>
</div>
