# NetworkPolicy de ingreso (kindnet las aplica; verificado con un par de pods allowed/denied).
# Solo restringe el tráfico ENTRANTE; el saliente queda libre (DNS, etc.).
# Las probes del kubelet no se ven afectadas.
#
# Flujo permitido:
#   ingress-nginx -> frontend (8080)      navegador -> app
#   ingress-nginx -> backend  (8080)      el Ingress enruta /api y /actuator/health directo al backend
#   frontend      -> backend  (8080)      proxy /api/ de nginx
#   backend       -> postgres (5432)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: orderhub
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller-to-frontend
  namespace: orderhub
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-and-ingress-controller-to-backend
  namespace: orderhub
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-to-postgres
  namespace: orderhub
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - port: 5432
