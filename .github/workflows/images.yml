name: Images

on:
  push:
    branches: [main]
    # No reconstruir imágenes por cambios que no las afectan (p. ej. el commit que sube el tag
    # en infra/k8s, que de otro modo generaría un ciclo de builds innecesarios)
    paths-ignore:
      - "docs/**"
      - "infra/k8s/**"
      - "scripts/**"
      - "**/*.md"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: alejo11102001

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/orderhub-${{ matrix.name }}
          tags: |
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Escaneo Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.OWNER }}/orderhub-${{ matrix.name }}:latest
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Publicar
        run: docker push --all-tags ${{ env.REGISTRY }}/${{ env.OWNER }}/orderhub-${{ matrix.name }}