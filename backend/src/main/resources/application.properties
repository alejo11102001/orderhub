spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/orderhub
spring.datasource.username=orderhub

spring.jpa.hibernate.ddl.auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

app.cors.allowed-origins=http://localhost:4200
app.jwt.expiration-minutes=60

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

spring.datasource.password=${db.password}
app.jwt.secret=${jwt.secret}

spring.config.import=vault://
spring.cloud.vault.uri=${VAULT_URI:http://localhost:8200}
spring.cloud.vault.token=${VAULT_TOKEN}
spring.cloud.vault.authentication=TOKEN
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.default-context=orderhub
spring.cloud.vault.kv.application-name=orderhub

# Admin seed: vacío = no se crea. La contraseña puede venir de Vault (admin.password) o de APP_ADMIN_PASSWORD
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.vault-password=${admin.password:}

# Productos de demostración (desactivado por defecto; también se activa con el perfil "demo")
app.demo-data=${APP_DEMO_DATA:false}
